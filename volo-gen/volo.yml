# Please refer to https://www.cloudwego.io/docs/volo/guide/config/ for the configuration file format.
entries:
  default:
    filename: pow_captcha_volo_gen.rs
    protocol: protobuf
    services:
    - idl:
        source: local
        path: ../contracts/pow_captcha/v1/pow_captcha_backend.proto
        includes:
        - ../contracts
    - idl:
        source: local
        path: ../contracts/pow_captcha/v1/pow_captcha_frontend.proto
        includes:
        - ../contracts

[workspace]
members = ["volo-gen", "pow-captcha-server", "pow-captcha-core"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
# we recommend to use the latest framework version for new features and bug fixes
volo = "*"
volo-build = "*"
volo-grpc = "*"
pilota = "*"

anyhow = "1"
futures = "0.3"
tokio = "1"
sqlx = "0.8"
